<section class="project-detail section">
  <div class="container" *ngIf="project() as project; else notFound">
    <a routerLink="/" fragment="projects" class="project-detail__back">
      ← Back to projects
    </a>

    <p class="project-detail__eyebrow">Project</p>
    <h1 class="project-detail__title">{{ project.title }}</h1>
    <p class="project-detail__description">{{ project.longDescription }}</p>

    <figure *ngIf="project.image as image" class="project-detail__image">
      <img
        [src]="image.src"
        [alt]="image.alt"
        [width]="image.width"
        [height]="image.height"
      />
    </figure>

    <div class="project-detail__meta">
      <div class="project-detail__block">
        <h2>My contribution</h2>
        <p>{{ project.role }}</p>
      </div>

      <div class="project-detail__block">
        <h2>Tech stack</h2>
        <ul>
          <li *ngFor="let tech of project.techStack">{{ tech }}</li>
        </ul>
      </div>

      <div class="project-detail__block">
        <h2>What I learned</h2>
        <p>{{ project.learnings }}</p>
      </div>
    </div>

    <div *ngIf="project.links as links" class="project-detail__links">
      <a
        *ngFor="let link of links"
        class="btn btn-outline"
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ link.label }}
      </a>
    </div>

    <p *ngIf="project.repositoryNote as note" class="project-detail__note">
      {{ note }}
    </p>
  </div>

  <ng-template #notFound>
    <div class="container">
      <p>Project not found.</p>
      <a routerLink="/" fragment="projects">
        ← Back to projects
      </a>
    </div>
  </ng-template>
</section>
