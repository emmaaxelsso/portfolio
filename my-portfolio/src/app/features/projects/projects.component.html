<app-navbar></app-navbar>

<main class="projects-page">
  <div class="container">
    <a routerLink="/" fragment="projects" class="back-link">
      ← Back to home
    </a>

    <header class="projects-page__header">
      <p class="eyebrow">Projects</p>
      <h1>Things I've built.</h1>
      <p class="projects-page__intro">
        A collection of personal projects, university coursework,
        and things I've learned along the way.
      </p>
    </header>

    <div class="projects-grid">
      <a
        *ngFor="let project of projects"
        [routerLink]="['/projects', project.slug]"
        class="project-card"
      >
        <h2>{{ project.title }}</h2>
        <p>{{ project.description }}</p>

        <ul class="tech-list" aria-label="Technologies">
          <li *ngFor="let tech of project.techStack">
            {{ tech }}
          </li>
        </ul>

        <span class="project-card__link">
          View project <span aria-hidden="true">→</span>
        </span>
      </a>
    </div>
  </div>
</main>
